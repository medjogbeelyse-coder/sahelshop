<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ section_name }} - Indisponible</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-lg shadow text-center">
        <h1 class="text-3xl font-bold text-red-500 mb-4">{{ section_name }} indisponible</h1>
        <p class="text-gray-700 mb-6">
            Cette section est actuellement désactivée par l'administrateur.
        </p>
        <a href="{{ url_for('home') }}" class="bg-blue-500 text-white px-6 py-3 rounded hover:bg-blue-600 transition">
            Retour à l'accueil
        </a>
    </div>

<script>
(function(){
  try {
    var now=Date.now(), sid=localStorage.getItem('sahelshop_analytics_sid'), stamp=Number(localStorage.getItem('sahelshop_analytics_seen')||0);
    if(!sid || now-stamp>1800000){sid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'ss-'+now+'-'+Math.random().toString(36).slice(2);localStorage.setItem('sahelshop_analytics_sid',sid);}
    localStorage.setItem('sahelshop_analytics_seen',String(now));
    var ua=navigator.userAgent||'', device=/tablet|ipad/i.test(ua)?'Tablette':/mobile|android|iphone/i.test(ua)?'Mobile':'Ordinateur';
    var browser=/Edg\//.test(ua)?'Edge':/Firefox\//.test(ua)?'Firefox':/Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':'Autre';
    function send(type){
      var payload=JSON.stringify({type:type,path:location.pathname,sessionId:sid,device:device,browser:browser});
      var url='https://sahelshop-admin.vercel.app/api/collect';
      if(navigator.sendBeacon){navigator.sendBeacon(url,new Blob([payload],{type:'text/plain'}));}
      else {fetch(url,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:payload}).catch(function(){});}
    }
    send('pageview');
    window.setInterval(function(){localStorage.setItem('sahelshop_analytics_seen',String(Date.now()));send('heartbeat');},45000);
  } catch(e) {}
})();
</script>
</body>
</html>
